# HTTP / IP default site. Disable the distribution's welcome server first.
map $http_upgrade $new_api_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    client_max_body_size 64m;
    proxy_next_upstream off;

    # Copy the repository nginx.conf.example to this system include path.
    include /etc/nginx/new-api-cockpit-locations.inc;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $new_api_connection_upgrade;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
        proxy_cache off;
    }
}
