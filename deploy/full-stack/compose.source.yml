# Build-only override. Runtime always uses the base compose.yml.
services:
  statistics:
    build:
      context: "./source"
      args:
        PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
  image-studio:
    build:
      context: "./source"
      args:
        PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
  chat:
    build:
      context: "./source"
      args:
        PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
