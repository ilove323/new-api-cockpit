[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "newapi-cockpit"
version = "0.1.3"
description = "Extended New API administration, usage reports, budgets and user/key management"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "ilove323"}]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/ilove323/new-api-statistics"
Issues = "https://github.com/ilove323/new-api-statistics/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
new_api_statistics = ["*.sql", "migrations/*.sql", "templates/*.html", "templates/partials/*.html", "static/*", "static/icons/*.svg", "static/fonts/*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
