services:
  statistics:
    image: ghcr.io/ilove323/new-api-cockpit:${IMAGE_TAG:?Set IMAGE_TAG to a released version}
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: .env
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8091}:8000"
    networks: [new-api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  new-api:
    external: true
    name: ${NEW_API_NETWORK:-new-api-network}
