<dialog id="user-profile-dialog" aria-labelledby="user-profile-title">
  <h2 id="user-profile-title">用户资料</h2>
  <form id="user-profile-form">
    <div id="user-profile-fields"></div>
    <p class="hint">通过 New API 官方接口修改用户。密码只用于重置，不读取或保存到操作记录。</p>
    <p id="user-profile-error" class="error" role="status"></p>
    <div class="dialog-actions"><button id="user-profile-cancel" type="button">取消</button><button id="user-profile-save" type="submit">确认保存</button></div>
  </form>
</dialog>
