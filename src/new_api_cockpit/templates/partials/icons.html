{# Lucide ISC assets. Icon dimensions share the ui.css scale. #}
{% macro icon(name, class_name='') -%}
<svg class="ui-icon {{ class_name }}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="/cockpit/static/icons.svg#{{ name }}"></use></svg>
{%- endmacro %}
