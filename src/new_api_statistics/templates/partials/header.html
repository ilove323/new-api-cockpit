{% from "partials/icons.html" import icon %}
{% macro app_header(site_name) -%}
<header class="app-header">
  <div class="header-start">
    <button id="sidebar-toggle" class="icon-button button-ghost" type="button" aria-label="收起导航" title="收起导航" aria-expanded="true" aria-controls="app-sidebar">{{ icon('panel-left') }}</button>
    <a class="brand" href="/cockpit/statistics/">{{ icon('chart-no-axes-combined', 'brand-mark') }}<span>{{ site_name }}</span></a>
    <span class="app-name">newapi-cockpit</span>
  </div>
  {{ caller() }}
</header>
{%- endmacro %}
